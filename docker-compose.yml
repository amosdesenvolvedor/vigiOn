services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MYSQL_DATABASE:-vigioni}
      MARIADB_USER: ${MYSQL_USER:-vigioni}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:-change-me-local}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root-local}
    ports:
      - '127.0.0.1:3306:3306'
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_HOST: 0.0.0.0
      API_PORT: 3000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      APP_URL: ${APP_URL:-http://localhost:5173}
      EMAIL_FROM: ${EMAIL_FROM:-VigiOn <no-reply@vigion.cloud>}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-mailto:security@vigion.cloud}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      GOOGLE_AUTH_ENABLED: ${GOOGLE_AUTH_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      MICROSOFT_AUTH_ENABLED: ${MICROSOFT_AUTH_ENABLED:-false}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-}
      CAMERA_CREDENTIAL_KEY: ${CAMERA_CREDENTIAL_KEY:-}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      GATEWAY_PAIRING_TTL_MINUTES: ${GATEWAY_PAIRING_TTL_MINUTES:-10}
      GATEWAY_OFFLINE_TIMEOUT_SECONDS: ${GATEWAY_OFFLINE_TIMEOUT_SECONDS:-120}
      GATEWAY_COMMAND_TTL_SECONDS: ${GATEWAY_COMMAND_TTL_SECONDS:-300}
      STREAM_SESSION_TTL_SECONDS: ${STREAM_SESSION_TTL_SECONDS:-600}
      STREAM_IDLE_TIMEOUT_SECONDS: ${STREAM_IDLE_TIMEOUT_SECONDS:-90}
      STREAM_START_TIMEOUT_SECONDS: ${STREAM_START_TIMEOUT_SECONDS:-45}
      MAX_ACTIVE_STREAMS_PER_ORG: ${MAX_ACTIVE_STREAMS_PER_ORG:-10}
      STREAM_MEDIA_ROOT: /tmp/vigion-streams
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-vigion-media}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-}
      MEDIA_ACCESS_TTL_SECONDS: ${MEDIA_ACCESS_TTL_SECONDS:-300}
      SNAPSHOT_MAX_BYTES: ${SNAPSHOT_MAX_BYTES:-5242880}
      RECORDING_MAX_BYTES: ${RECORDING_MAX_BYTES:-67108864}
      RECORDING_SEGMENT_SECONDS: ${RECORDING_SEGMENT_SECONDS:-60}
      RETENTION_INTERVAL_SECONDS: ${RETENTION_INTERVAL_SECONDS:-300}
      DATABASE_URL: mysql://${MYSQL_USER:-vigioni}:${MYSQL_PASSWORD:-change-me-local}@db:3306/${MYSQL_DATABASE:-vigioni}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      BILLING_ENABLED: ${BILLING_ENABLED:-false}
      BILLING_ENVIRONMENT: ${BILLING_ENVIRONMENT:-test}
      BILLING_PROVIDER: ${BILLING_PROVIDER:-stripe}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_BASIC: ${STRIPE_PRICE_BASIC:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_BUSINESS: ${STRIPE_PRICE_BUSINESS:-}
      FRONTEND_URL: ${FRONTEND_URL:-https://vigion.cloud}
      BILLING_RECONCILE_INTERVAL_SECONDS: ${BILLING_RECONCILE_INTERVAL_SECONDS:-900}
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - '127.0.0.1:9000:9000'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api/v1}
    restart: unless-stopped
    ports:
      - '127.0.0.1:5173:80'
    depends_on:
      - api
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }

volumes:
  mariadb_data:
  caddy_data:
  caddy_config:
  minio_data:
