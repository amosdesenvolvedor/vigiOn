services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MYSQL_DATABASE:-vigioni}
      MARIADB_USER: ${MYSQL_USER:-vigioni}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:-change-me-local}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root-local}
    ports:
      - '3306:3306'
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      DATABASE_URL: mysql://${MYSQL_USER:-vigioni}:${MYSQL_PASSWORD:-change-me-local}@db:3306/${MYSQL_DATABASE:-vigioni}
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api/v1}
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - api

volumes:
  mariadb_data:
